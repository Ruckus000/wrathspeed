name: Tests

on:
  # Deliberately unfiltered by base branch. A `branches:` filter here means a PR whose
  # base is another PR's branch gets no run at all -- and GitHub renders "no workflow
  # applies" identically to "the run has not started yet", so a stacked PR sits looking
  # like it is waiting on CI that will never arrive. Two PRs in the tab bar / rows stack
  # sat that way until someone thought to run `gh run list` and saw an empty array.
  # Changing a PR's base does not fire a run either, since `edited` is not one of the
  # default trigger types, so retargeting cannot rescue it after the fact.
  pull_request:
  # This one stays filtered: without it every push to a topic branch would run the whole
  # macOS suite a second time alongside its own pull_request run.
  push:
    branches: [main]

# A new push to a PR makes the previous run's answer irrelevant, and macOS
# runners bill at ten times the Linux rate.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Package, unit and UI tests
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          set -euo pipefail
          # The deployment target is iOS 26 and SWIFT_VERSION is 6.0. An older Xcode
          # fails with availability errors that read as source bugs rather than as a
          # toolchain mismatch, so check the version rather than let it get that far.
          newest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$newest"
          # Captured once rather than piped. `xcodebuild -version | head -1` closes
          # the pipe after the first of the two lines it writes, and xcodebuild does
          # not handle the resulting SIGPIPE -- it throws NSFileHandleOperationException
          # ("Broken pipe") and aborts with exit 134. That is a race, so it failed
          # rarely and looked like an infrastructure blip; the version gate itself was
          # never the thing rejecting the build. Run 32755165483 is an example: exit
          # 134 eleven seconds in, on Xcode 26.6, which passes this check.
          version_output="$(xcodebuild -version)"
          echo "$version_output"
          major="$(printf '%s\n' "$version_output" | sed -nE '1s/^Xcode ([0-9]+).*/\1/p')"
          if [ "$major" -lt 26 ]; then
            echo "::error::Xcode $major is older than the project's iOS 26 deployment target"
            exit 1
          fi

      # Seconds, and it catches the one thing the test suites cannot: the committed
      # app icons are rendered from Design/WSMarkGeometry.swift, so editing the mark
      # without re-running the renderer ships an icon that no longer matches the app.
      - name: App icons match the mark geometry
        run: Tools/brand/render-icons.sh --check

      # First because it takes seconds and covers the planner, stepper and cue
      # policy. No point spending ten minutes on the simulator if this is red.
      - name: WrathspeedCore package tests
        working-directory: WrathspeedCore
        run: swift test

      - name: Pick an iOS simulator
        id: sim
        run: |
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import json, subprocess, sys

          # Resolved at run time rather than pinned. The runner image's device list
          # moves -- it currently ships no iOS 26.0 runtime and no iPhone 16e outside
          # 26.2 -- so a hardcoded name/OS destination rots silently into a red build
          # that looks like a test failure.
          raw = subprocess.run(
              ["xcrun", "simctl", "list", "devices", "available", "--json"],
              capture_output=True, text=True, check=True,
          ).stdout
          devices = json.loads(raw)["devices"]

          candidates = []
          for runtime, entries in devices.items():
              key = runtime.rsplit(".", 1)[-1]          # e.g. iOS-26-2
              if not key.startswith("iOS-"):
                  continue
              version = tuple(int(p) for p in key[len("iOS-"):].split("-"))
              if version < (26,):                        # below the deployment target
                  continue
              for device in entries:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      candidates.append((version, device["name"], device["udid"]))

          if not candidates:
              print("::error::No available iPhone simulator on iOS 26 or newer", file=sys.stderr)
              subprocess.run(["xcrun", "simctl", "list", "devices", "available"])
              raise SystemExit(1)

          version, name, udid = max(candidates)
          pretty = ".".join(str(p) for p in version)
          print(f"udid={udid}")
          print(f"label={name} (iOS {pretty})")
          print(f"Selected {name} on iOS {pretty} -- {udid}", file=sys.stderr)
          PY

      - name: Boot the simulator
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b

      # One invocation for both bundles, deliberately. This was split in two with a
      # `simctl erase` between them, on the theory that the app-hosted unit bundle left
      # persisted state that derailed the seeded UI launches. That was wrong twice over:
      # the UI launches pass -uiTestingResetStore, and Persistence.reset deletes every
      # @Model type, so there is nothing left to inherit; and the bisection that motivated
      # the split had "warm second run: green", which is the same unit-then-UI order and
      # should have been red if state were the cause. The real fault was a springboard
      # workout-background-access notice that `springboard.alerts` cannot see, fixed in
      # UITestOnboardingHelper. Splitting bought a second build and a re-boot on a runner
      # that bills at ten times Linux, for nothing.
      - name: App unit and UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Wrathspeed.xcodeproj \
            -scheme Wrathspeed \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult

      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcresult-${{ github.run_id }}
          path: TestResults.xcresult
          retention-days: 14
          if-no-files-found: ignore
