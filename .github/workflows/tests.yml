name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a PR makes the previous run's answer irrelevant, and macOS
# runners bill at ten times the Linux rate.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Package, unit and UI tests
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          set -euo pipefail
          # The deployment target is iOS 26 and SWIFT_VERSION is 6.0. An older Xcode
          # fails with availability errors that read as source bugs rather than as a
          # toolchain mismatch, so check the version rather than let it get that far.
          newest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$newest"
          xcodebuild -version
          major="$(xcodebuild -version | head -1 | sed -E 's/^Xcode ([0-9]+).*/\1/')"
          if [ "$major" -lt 26 ]; then
            echo "::error::Xcode $major is older than the project's iOS 26 deployment target"
            exit 1
          fi

      # Seconds, and it catches the one thing the test suites cannot: the committed
      # app icons are rendered from Design/WSMarkGeometry.swift, so editing the mark
      # without re-running the renderer ships an icon that no longer matches the app.
      - name: App icons match the mark geometry
        run: Tools/brand/render-icons.sh --check

      # First because it takes seconds and covers the planner, stepper and cue
      # policy. No point spending ten minutes on the simulator if this is red.
      - name: WrathspeedCore package tests
        working-directory: WrathspeedCore
        run: swift test

      - name: Pick an iOS simulator
        id: sim
        run: |
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import json, subprocess, sys

          # Resolved at run time rather than pinned. The runner image's device list
          # moves -- it currently ships no iOS 26.0 runtime and no iPhone 16e outside
          # 26.2 -- so a hardcoded name/OS destination rots silently into a red build
          # that looks like a test failure.
          raw = subprocess.run(
              ["xcrun", "simctl", "list", "devices", "available", "--json"],
              capture_output=True, text=True, check=True,
          ).stdout
          devices = json.loads(raw)["devices"]

          candidates = []
          for runtime, entries in devices.items():
              key = runtime.rsplit(".", 1)[-1]          # e.g. iOS-26-2
              if not key.startswith("iOS-"):
                  continue
              version = tuple(int(p) for p in key[len("iOS-"):].split("-"))
              if version < (26,):                        # below the deployment target
                  continue
              for device in entries:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      candidates.append((version, device["name"], device["udid"]))

          if not candidates:
              print("::error::No available iPhone simulator on iOS 26 or newer", file=sys.stderr)
              subprocess.run(["xcrun", "simctl", "list", "devices", "available"])
              raise SystemExit(1)

          version, name, udid = max(candidates)
          pretty = ".".join(str(p) for p in version)
          print(f"udid={udid}")
          print(f"label={name} (iOS {pretty})")
          print(f"Selected {name} on iOS {pretty} -- {udid}", file=sys.stderr)
          PY

      - name: Boot the simulator
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b

      # Unit tests first: they take seconds and fail fast.
      - name: App unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Wrathspeed.xcodeproj \
            -scheme Wrathspeed \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -only-testing:WrathspeedTests \
            -resultBundlePath UnitTestResults.xcresult

      # The unit bundle is hosted BY the app, so running it boots the real app with no test
      # launch arguments and leaves persisted state behind. A seeded UI launch on top of that
      # state does not produce the plan the calendar tests look for, and they fail hunting for
      # workouts that were never scheduled. It is entirely order-dependent, which is why this
      # suite has been intermittently red: one xcodebuild invocation runs unit then UI on one
      # simulator, so CI hit it on most runs and never on a developer's warm device.
      #
      # Reproduced by bisection on a freshly erased iPhone Air / iOS 26.5:
      #   UI bundle alone                  green
      #   unit bundle, then UI bundle      3 calendar tests fail
      #   UI bundle, then unit bundle      green
      #
      # Erasing here gives the UI tests the pristine device they are written against, and keeps
      # the unit tests first so they still fail fast.
      - name: Reset the simulator between the two bundles
        run: |
          set -euo pipefail
          xcrun simctl shutdown "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl erase "${{ steps.sim.outputs.udid }}"
          xcrun simctl boot "${{ steps.sim.outputs.udid }}"
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b

      - name: App UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Wrathspeed.xcodeproj \
            -scheme Wrathspeed \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -only-testing:WrathspeedUITests \
            -resultBundlePath TestResults.xcresult

      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcresult-${{ github.run_id }}
          # Both bundles: a unit failure and a UI failure now land in different files, and the
          # one you need is whichever step went red.
          path: |
            UnitTestResults.xcresult
            TestResults.xcresult
          retention-days: 14
          if-no-files-found: ignore
